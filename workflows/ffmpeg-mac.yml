# (Plan 49, fase 1) FFmpeg LGPL para Mac Apple Silicon.
#
# Compila ffmpeg y ffprobe desde el tarball oficial de ffmpeg.org, sin GPL ni
# nonfree, sin bibliotecas externas (solo frameworks y bibliotecas del sistema:
# VideoToolbox para H.264, AudioToolbox, AVFoundation para la cámara en vivo),
# y verifica lo mismo que scripts/fetchFfmpeg.mjs en Windows. Solo se corre a
# mano (Actions → "FFmpeg Mac (LGPL)" → Run workflow).
#
# Después de correrlo:
# 1. Bajar el artifact `ffmpeg-<versión>-darwin-arm64` (trae el tar.gz, su
#    .sha256 y el código fuente con su firma).
# 2. Publicarlo en goal-labs-ffmpeg, con el código fuente al lado (la oferta
#    de código fuente de la LGPL). Ese repo es solo para FFmpeg; el feed del
#    actualizador de la app sigue siendo goal-labs-releases:
#      gh release create ffmpeg-<versión> --repo nacholiporace/goal-labs-ffmpeg \
#        --title "FFmpeg <versión> (LGPL) para Goal Labs" \
#        --notes "Build LGPL de FFmpeg que lleva Goal Labs en Mac. Compilado por .github/workflows/ffmpeg-mac.yml." \
#        ffmpeg-<versión>-darwin-arm64.tar.gz ffmpeg-<versión>-darwin-arm64.tar.gz.sha256 \
#        ffmpeg-<versión>.tar.xz ffmpeg-<versión>.tar.xz.asc
# 3. En scripts/fetchFfmpeg.mjs, PINNED['darwin-arm64']: `tag` (ffmpeg-<versión>),
#    `url` (https://github.com/nacholiporace/goal-labs-ffmpeg/releases/download/ffmpeg-<versión>/ffmpeg-<versión>-darwin-arm64.tar.gz)
#    y `sha256` (el del .sha256). En una Mac, `npm run ffmpeg:fetch` lo baja y lo verifica.
#
# La versión tiene que ser la misma que FFMPEG_VERSION de scripts/fetchFfmpeg.mjs.
name: FFmpeg Mac (LGPL)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Versión de FFmpeg (la misma que FFMPEG_VERSION en scripts/fetchFfmpeg.mjs)
        required: true
        default: '9.0.2'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      FFMPEG_VERSION: ${{ inputs.version }}
      # Igual que el mínimo de Electron 39 (macOS 12).
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - name: Bajar el código fuente y verificar la firma
        run: |
          set -euo pipefail
          curl -fsSLO "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"
          curl -fsSLO "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz.asc"
          command -v gpg >/dev/null || brew install gnupg
          curl -fsSL https://ffmpeg.org/ffmpeg-devel.asc | gpg --import
          gpg --verify "ffmpeg-${FFMPEG_VERSION}.tar.xz.asc" "ffmpeg-${FFMPEG_VERSION}.tar.xz"
          tar -xf "ffmpeg-${FFMPEG_VERSION}.tar.xz"

      - name: Compilar (LGPL, estático, sin bibliotecas externas)
        working-directory: ffmpeg-${{ inputs.version }}
        run: |
          set -euo pipefail
          # --disable-autodetect: que no tome nada de Homebrew del runner; se
          # prende a mano solo lo que viene con macOS.
          ./configure \
            --prefix="$GITHUB_WORKSPACE/prefix" \
            --arch=arm64 --cc=clang \
            --disable-gpl --disable-nonfree \
            --disable-shared --enable-static \
            --disable-doc --disable-debug --disable-ffplay \
            --disable-autodetect \
            --enable-videotoolbox --enable-audiotoolbox \
            --enable-avfoundation --enable-securetransport \
            --enable-zlib --enable-bzlib --enable-iconv
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Verificar
        run: |
          set -euo pipefail
          BIN="$GITHUB_WORKSPACE/prefix/bin"
          "$BIN/ffmpeg" -hide_banner -version | tee version.txt
          for flag in --enable-gpl --enable-nonfree --enable-libx264 --enable-libx265; do
            if grep -q -- "$flag" version.txt; then echo "::error::la configuración tiene $flag"; exit 1; fi
          done
          "$BIN/ffmpeg" -hide_banner -L | grep -q 'GNU Lesser General Public License' || { echo '::error::ffmpeg -L no dice LGPL'; exit 1; }
          ENC="$("$BIN/ffmpeg" -hide_banner -encoders)"
          for e in h264_videotoolbox aac; do
            echo "$ENC" | grep -qE "^ [VAS][.F][.S][.X][.B][.D] $e " || { echo "::error::falta el codificador $e"; exit 1; }
          done
          if echo "$ENC" | grep -qE ' libx26[45] '; then echo '::error::trae libx264/libx265'; exit 1; fi
          "$BIN/ffmpeg" -hide_banner -devices | grep -q avfoundation || { echo '::error::falta avfoundation (cámara)'; exit 1; }
          V1="$("$BIN/ffmpeg" -version | head -1 | awk '{print $3}')"
          V2="$("$BIN/ffprobe" -version | head -1 | awk '{print $3}')"
          [ "$V1" = "$V2" ] || { echo "::error::ffprobe $V2 != ffmpeg $V1"; exit 1; }
          for b in ffmpeg ffprobe; do
            file "$BIN/$b" | grep -q arm64 || { echo "::error::$b no es arm64"; exit 1; }
            # Solo bibliotecas del sistema: nada de /opt/homebrew ni /usr/local.
            if otool -L "$BIN/$b" | tail -n +2 | awk '{print $1}' | grep -vE '^(/usr/lib/|/System/Library/)'; then
              echo "::error::$b enlaza bibliotecas fuera del sistema"; exit 1
            fi
          done
          # Una codificación de prueba con VideoToolbox. La máquina virtual del
          # runner puede no exponer el codificador por hardware: solo avisa.
          if "$BIN/ffmpeg" -hide_banner -loglevel error -f lavfi -i testsrc2=d=2:s=320x180:r=25 \
            -f lavfi -i sine=d=2 -c:v h264_videotoolbox -c:a aac -shortest -y prueba.mp4; then
            "$BIN/ffprobe" -hide_banner -loglevel error -show_entries stream=codec_name -of csv=p=0 prueba.mp4
          else
            echo '::warning::h264_videotoolbox no codificó en el runner; probarlo en una Mac real'
          fi

      - name: Empaquetar
        run: |
          set -euo pipefail
          NAME="ffmpeg-${FFMPEG_VERSION}-darwin-arm64"
          mkdir -p stage out
          cp prefix/bin/ffmpeg prefix/bin/ffprobe stage/
          cp "ffmpeg-${FFMPEG_VERSION}/LICENSE.md" "ffmpeg-${FFMPEG_VERSION}/COPYING.LGPLv2.1" stage/
          tar -czf "out/${NAME}.tar.gz" -C stage .
          (cd out && shasum -a 256 "${NAME}.tar.gz" | tee "${NAME}.tar.gz.sha256")
          cp "ffmpeg-${FFMPEG_VERSION}.tar.xz" "ffmpeg-${FFMPEG_VERSION}.tar.xz.asc" out/

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ inputs.version }}-darwin-arm64
          path: out/
          if-no-files-found: error
          retention-days: 90
